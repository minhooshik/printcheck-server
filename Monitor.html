<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>출력 대기 현황</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background:#0f0f13;
            color:#e8e8f0;
            font-family:'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
            min-height:100vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            gap:20px;
            padding:30px;
        }
        .title {
            font-size:22px;
            font-weight:900;
            background:linear-gradient(135deg,#00ff88,#00e5ff);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            letter-spacing:-0.5px;
        }
        .sub {
            font-size:13px;
            color:#6b6b80;
            text-align:center;
        }
        .btn-group {
            display:flex;
            flex-direction:column;
            gap:14px;
            width:100%;
            max-width:300px;
        }
        .btn {
            padding:16px 24px;
            border-radius:16px;
            border:none;
            color:#fff;
            font-size:16px;
            font-weight:900;
            cursor:pointer;
            letter-spacing:-0.3px;
            transition:transform 0.15s, opacity 0.15s;
        }
        .btn:active { transform:scale(0.96); opacity:0.9; }

        /* 1출력실 - 파랑 (준비 중) */
        .btn-room1 {
            background:linear-gradient(135deg,#4a90d9,#00e5ff);
            box-shadow:0 8px 24px rgba(0,229,255,0.2);
            opacity:0.4;
            cursor:not-allowed;
        }

        /* 3출력실 - 초록 */
        .btn-room3 {
            background:linear-gradient(135deg,#00ff88,#00c853);
            box-shadow:0 8px 24px rgba(0,255,136,0.25);
            color:#003320;
        }

        .status {
            font-size:13px;
            color:#6b6b80;
            min-height:20px;
            text-align:center;
        }
        .status.error { color:#ff5252; }
    </style>
</head>
<body>
    <div class="title">🖨️ 출력 대기 현황</div>
    <div class="sub">출력실을 선택하세요</div>

    <div class="btn-group">
        <!-- 1출력실: 준비 중 -->
        <button class="btn btn-room1" disabled>
            1출력실&nbsp;&nbsp;준비 중
        </button>

        <!-- 3출력실: 운영 중 -->
        <button class="btn btn-room3" onclick="goRoom('room3')">
            3출력실 출력대기현황
        </button>
    </div>

    <div class="status" id="status"></div>

    <script>
        const URL_KEYS = {
            room1: "monitor_url_room1",
            room3: "monitor_url_room3",
        };

        async function goRoom(roomKey) {
            const status = document.getElementById("status");
            status.className = "status";
            status.innerText = "접속 중...";
            try {
                const res  = await fetch(
                    "https://raw.githubusercontent.com/minhooshik/printcheck-server/main/server.json",
                    { cache: "no-store" }
                );
                const data = await res.json();
                const url  = data[URL_KEYS[roomKey]];
                if (!url) {
                    status.className = "status error";
                    status.innerText = "서버 주소를 찾을 수 없습니다. 서버가 실행 중인지 확인하세요.";
                    return;
                }
                status.innerText = "연결 중...";
                window.location.href = url;
            } catch(e) {
                status.className = "status error";
                status.innerText = "접속 실패 — 인터넷 연결을 확인하세요.";
            }
        }
    </script>
</body>
</html>
