<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>출력 대기 현황</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        h2 {
            font-size: 20px;
            color: #333;
            margin-bottom: 28px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
            max-width: 300px;
        }

        .btn {
            padding: 18px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        .btn:active { opacity: 0.75; }

        /* ── 출력실별 색상 ─────────────────────────
           나중에 출력실 추가 시 색상만 지정하면 됨  */
        .btn-room1 { background: #4a90d9; color: white; }   /* 1출력실 - 파랑 */
        .btn-room3 { background: #5cb85c; color: white; }   /* 3출력실 - 초록 */

        .btn-disabled {
            background: #cccccc;
            color: #888;
            cursor: not-allowed;
        }

        .status {
            margin-top: 16px;
            font-size: 13px;
            color: gray;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <h2>출력 대기 현황</h2>

    <div class="btn-group">

        <!-- 1출력실: 준비 중 (나중에 btn-disabled → btn-room1, disabled 제거, onclick 추가) -->
        <button class="btn btn-disabled" disabled>
            1출력실 출력대기현황<br>
            <span style="font-size:12px; font-weight:normal;">(준비 중)</span>
        </button>

        <!-- 3출력실: 현재 운영 중 -->
        <button class="btn btn-room3" onclick="goRoom('room3')">
            3출력실 출력대기현황
        </button>

    </div>

    <p class="status" id="status"></p>

    <script>
        // ── URL 키 매핑 ──────────────────────────────────
        // 나중에 1출력실 추가 시 여기에 키만 추가하면 됨
        const URL_KEYS = {
            room1: "monitor_url_room1",   // 추후 사용
            room3: "monitor_url_room3",
        };

        const GITHUB_JSON = "https://raw.githubusercontent.com/minhooshik/printcheck-server/main/server.json";

        async function goRoom(roomKey) {
            const statusEl = document.getElementById("status");
            statusEl.innerText = "접속 중...";
            try {
                const res  = await fetch(GITHUB_JSON + "?t=" + Date.now());
                const data = await res.json();
                const url  = data[URL_KEYS[roomKey]];
                if (!url) {
                    statusEl.innerText = "서버 주소를 찾을 수 없습니다";
                    return;
                }
                window.location.href = url;
            } catch {
                statusEl.innerText = "접속 실패 - 잠시 후 다시 시도해 주세요";
            }
        }
    </script>

</body>
</html>
