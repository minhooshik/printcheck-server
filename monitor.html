<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>출력 대기 현황 접속</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:#0f1117;
    color:#ffffff;
    font-family:-apple-system,BlinkMacSystemFont,'맑은 고딕',sans-serif;

    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;
}

.wrap{
    width:100%;
    max-width:340px;
}

.title{
    text-align:center;
    margin-bottom:12px;
    font-size:28px;
    font-weight:800;
    letter-spacing:-1px;
}

.sub{
    text-align:center;
    color:#9aa4b2;
    font-size:14px;
    margin-bottom:28px;
}

.group{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.btn{
    border:none;
    border-radius:18px;

    padding:18px 20px;

    font-size:17px;
    font-weight:700;

    cursor:pointer;

    transition:0.15s;
}

.btn:active{
    transform:scale(0.97);
}

.btn.disabled{
    background:#2a2f38;
    color:#777;
    cursor:not-allowed;
}

.btn.room3{
    background:linear-gradient(135deg,#00ff88,#00c853);
    color:#002b17;
    box-shadow:0 8px 24px rgba(0,255,136,0.25);
}

.status{
    margin-top:24px;
    text-align:center;
    font-size:13px;
    color:#8b95a1;
    min-height:20px;
}

.status.error{
    color:#ff5c5c;
}
</style>
</head>

<body>

<div class="wrap">

    <div class="title">🖨️ 출력 대기 현황</div>
    <div class="sub">출력실을 선택하세요</div>

    <div class="group">

        <!-- 준비중 -->
        <button class="btn disabled" disabled>
            1출력실 준비중
        </button>

        <!-- 운영중 -->
        <button class="btn room3" onclick="goRoom3()">
            3출력실 출력대기현황
        </button>

    </div>

    <div class="status" id="status"></div>

</div>

<script>

const SERVER_JSON =
"https://raw.githubusercontent.com/minhooshik/printcheck-server/main/server.json";

async function goRoom3(){

    const status = document.getElementById("status");

    status.className = "status";
    status.innerText = "서버 확인 중...";

    try{

        const res = await fetch(
            SERVER_JSON,
            { cache:"no-store" }
        );

        const data = await res.json();

        if(!data.monitor_url){

            status.className = "status error";
            status.innerText = "monitor_url 값을 찾을 수 없습니다.";
            return;
        }

        status.innerText = "연결 중...";

        window.location.href = data.monitor_url;

    }catch(e){

        status.className = "status error";
        status.innerText = "접속 실패 · 인터넷 또는 서버 상태를 확인하세요.";

    }
}

</script>

</body>
</html>
