<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>파일 상태 확인</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#0f0f13;
            color:#e8e8f0;
            font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;

            min-height:100vh;

            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;

            padding:30px;
        }

        .wrap{
            width:100%;
            max-width:340px;

            display:flex;
            flex-direction:column;
            gap:14px;

            text-align:center;
        }

        .title{
            font-size:24px;
            font-weight:900;

            background:linear-gradient(135deg,#00ff88,#00e5ff);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
        }

        .title .icon{
            -webkit-text-fill-color:initial;
            color:#00ffd0;
        }

        .sub{
            font-size:13px;
            color:#6b6b80;
            line-height:1.5;
        }

        /* 구분선 */
        .divider{
            border:none;
            border-top:1px solid #2a2a3a;
            margin:4px 0;
        }

        .section-label{
            font-size:11px;
            color:#555566;
            letter-spacing:0.5px;
            font-weight:700;
            text-align:left;
            padding-left:2px;
        }

        /* 기본 버튼 */
        .btn{
            border:none;
            border-radius:16px;

            padding:16px 24px;

            font-size:16px;
            font-weight:900;
            letter-spacing:-0.3px;

            cursor:pointer;

            transition:
                transform .15s ease,
                opacity .15s ease;
        }

        .btn:hover{ opacity:0.92; }
        .btn:active{ transform:scale(0.96); }

        /* 파일상태확인 버튼 */
        .btn-check{
            background:linear-gradient(135deg,#00ff88,#00c853);
            color:#003320;
            box-shadow:0 8px 24px rgba(0,255,136,0.2);
        }

        /* 모니터 버튼 (파란 계열) */
        .btn-monitor1{
            background:linear-gradient(135deg,#00b4ff,#0066ff);
            color:#ffffff;
            box-shadow:0 8px 24px rgba(0,100,255,0.2);
        }

        .btn-monitor3{
            background:linear-gradient(135deg,#ff6a00,#ff9500);
            color:#ffffff;
            box-shadow:0 8px 24px rgba(255,100,0,0.2);
        }

        .status{
            min-height:20px;
            font-size:13px;
            color:#6b6b80;
        }

        .status.error{   color:#ff5b5b; }
        .status.success{ color:#00ff88; }
    </style>
</head>

<body>

    <div class="wrap">

        <div class="title">
            <span class="icon">🖨️</span>
            출력실 현황
        </div>

        <div class="sub">버튼을 눌러 원하는 페이지에 접속하세요</div>

        <!-- 파일 상태 확인 -->
        <div class="section-label">📂 파일 상태 확인</div>
        <button class="btn btn-check" onclick="goPage('check')">
            파일 상태 확인
        </button>

        <hr class="divider">

        <!-- 모니터 -->
        <div class="section-label">📊 출력 대기 모니터</div>
        <button class="btn btn-monitor1" onclick="goPage('monitor1')">
            1출력실 모니터
        </button>
        <button class="btn btn-monitor3" onclick="goPage('monitor3')">
            3출력실 모니터
        </button>

        <div class="status" id="status"></div>

    </div>

    <script>

        const SERVER_JSON =
            "https://raw.githubusercontent.com/minhooshik/printcheck-server/main/server.json";

        // key 매핑: 버튼 → server.json 필드
        const KEY_MAP = {
            check:    ["url", "printcheck_url"],
            monitor1: ["monitor1_url"],
            monitor3: ["monitor3_url"],
        };

        async function goPage(type){

            const status = document.getElementById("status");
            status.className = "status";
            status.innerText = "접속 중...";

            try{
                const res = await fetch(
                    SERVER_JSON + "?t=" + Date.now(),
                    { cache:"no-store" }
                );
                const data = await res.json();

                let target = null;
                for(const key of KEY_MAP[type]){
                    if(data[key]){ target = data[key]; break; }
                }

                if(!target){
                    status.className = "status error";
                    status.innerText = "서버 주소를 찾을 수 없습니다.";
                    return;
                }

                status.className = "status success";
                status.innerText = "연결 중...";
                window.location.href = target;

            }catch(e){
                status.className = "status error";
                status.innerText = "접속 실패 — 인터넷 연결을 확인하세요.";
            }
        }

    </script>

</body>
</html>
