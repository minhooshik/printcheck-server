<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>파일 상태 확인</title>

<style>

body{
    margin:0;
    background:#f3f4f7;
    font-family:'Malgun Gothic',sans-serif;
}

.wrap{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.title{
    font-size:34px;
    font-weight:bold;
    margin-bottom:50px;
}

.btn{
    width:320px;
    padding:22px;
    margin:14px;
    border:none;
    border-radius:14px;
    background:#2563eb;
    color:white;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
}

.btn:hover{
    transform:scale(1.03);
    background:#1d4ed8;
}

</style>
</head>
<body>

<div class="wrap">

    <div class="title">파일 상태 확인</div>

    <button class="btn"
    onclick="location.href='http://112.218.160.210:5100/printcheck'">
        상태 체크
    </button>

    <button class="btn"
    onclick="location.href='http://112.218.160.210:5100/1p'">
        1출력실 모니터
    </button>

    <button class="btn"
    onclick="location.href='http://112.218.160.210:5100/3p'">
        3출력실 모니터
    </button>

</div>

</body>
</html>
