<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>파일 상태 확인</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#0f0f13;
            color:#e8e8f0;
            font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;

            min-height:100vh;

            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;

            padding:30px;
        }

        .wrap{
            width:100%;
            max-width:320px;

            display:flex;
            flex-direction:column;
            gap:18px;

            text-align:center;
        }

        .title{
            font-size:24px;
            font-weight:900;

            background:linear-gradient(135deg,#00ff88,#00e5ff);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;

            letter-spacing:-0.5px;
        }

        .sub{
            font-size:13px;
            color:#6b6b80;
            line-height:1.5;
        }

        .btn{
            border:none;
            border-radius:18px;

            padding:18px 24px;

            font-size:17px;
            font-weight:900;
            letter-spacing:-0.3px;

            cursor:pointer;

            background:linear-gradient(135deg,#00ff88,#00c853);
            color:#003320;

            box-shadow:0 10px 28px rgba(0,255,136,0.25);

            transition:
                transform .15s ease,
                opacity .15s ease;
        }

        .btn:hover{
            opacity:0.95;
        }

        .btn:active{
            transform:scale(0.96);
        }

        .status{
            min-height:22px;

            font-size:13px;
            color:#6b6b80;
        }

        .status.error{
            color:#ff5b5b;
        }

        .status.success{
            color:#00ff88;
        }
    </style>
</head>

<body>

    <div class="wrap">

        <div class="title">
            🖨️ 파일 상태 확인
        </div>

        <div class="sub">
            버튼을 눌러 서버에 접속하세요
        </div>

        <button class="btn" onclick="goServer()">
            접속하기
        </button>

        <div class="status" id="status"></div>

    </div>

    <script>

        const SERVER_JSON =
            "https://raw.githubusercontent.com/minhooshik/printcheck-server/main/server.json";

        async function goServer(){

            const status = document.getElementById("status");

            status.className = "status";
            status.innerText = "접속 중...";

            try{

                const res = await fetch(
                    SERVER_JSON + "?t=" + Date.now(),
                    { cache:"no-store" }
                );

                const data = await res.json();

                // url 또는 printcheck_url 둘 다 대응
                const target =
                    data.url || data.printcheck_url;

                if(!target){
                    status.className = "status error";
                    status.innerText =
                        "서버 주소를 찾을 수 없습니다.";
                    return;
                }

                status.className = "status success";
                status.innerText = "연결 중...";

                window.location.href = target;

            }catch(e){

                status.className = "status error";
                status.innerText =
                    "접속 실패 — 인터넷 연결을 확인하세요.";

            }
        }

    </script>

</body>
</html>
